name: SensorWatch verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-lock.txt && python -m pip install -e . --no-deps
      - run: python -m pytest -q
      - run: sensorwatch analyze --reference sensorwatch/sample/reference.csv --input sensorwatch/sample/readings.csv --labels sensorwatch/sample/labels.json --output reports/ci-evaluation.json
      - run: npm ci && npx playwright install --with-deps chromium
      - name: Browser integration
        run: |
          sensorwatch serve > /tmp/sensorwatch.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8767/ >/dev/null && break; sleep 1; done
          npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-and-browser-evidence
          path: reports/
