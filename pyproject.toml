[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "sensorwatch"
version = "0.1.0"
description = "Local sensor fault exploration with statistical and Isolation Forest baselines"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.5", "scikit-learn==1.8.0", "flask==3.1.2"]
[project.optional-dependencies]
dev = ["pytest==8.4.2"]
[project.scripts]
sensorwatch = "sensorwatch.cli:main"
[tool.setuptools.packages.find]
include = ["sensorwatch*"]
[tool.setuptools.package-data]
sensorwatch = ["templates/*.html", "static/*.js", "static/*.css", "sample/*.csv", "sample/*.json"]
[tool.pytest.ini_options]
testpaths = ["tests"]
